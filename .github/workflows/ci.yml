name: CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint || true

  unit-tests:
    name: Unit Tests - Node ${{ matrix.node-version }}
    needs: lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 21.x, 22.x]
      fail-fast: false
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Initialize database
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          DB_PORT: 5432
        run: |
          until PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -c '\q'; do
            echo "Esperando a PostgreSQL..."
            sleep 2
          done
          PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -f ../db/init/schema.sql
          PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -f ../db/init/seed.sql

      - name: Run unit tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          DB_PORT: 5432
          NODE_ENV: test
        run: npm run test:run

      - name: Generate coverage report
        if: matrix.node-version == '20.x'
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          DB_PORT: 5432
          NODE_ENV: test
        run: npm run test:coverage

      - name: Archive coverage reports
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: backend/coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Initialize database
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          DB_PORT: 5432
        run: |
          until PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -c '\q'; do
            echo "Esperando a PostgreSQL..."
            sleep 2
          done
          PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -f ../db/init/schema.sql
          PGPASSWORD=mypassword psql -h localhost -U myuser -d myapp -f ../db/init/seed.sql

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start backend server
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          DB_PORT: 5432
          PORT: 3000
        run: |
          npm start &
          echo $! > backend.pid
          timeout 30 bash -c 'until curl -s http://localhost:3000; do sleep 1; done'

      - name: Start frontend server
        working-directory: ./frontend
        run: |
          npm run preview -- --port 5173 --host &
          echo $! > frontend.pid
          timeout 30 bash -c 'until curl -s http://localhost:5173; do sleep 1; done'

      - name: Install Selenium Side Runner
        run: npm install -g selenium-side-runner

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install ChromeDriver
        run: npm install -g chromedriver

      - name: Run E2E Tests
        working-directory: ./e2e-tests/selenium-ide
        run: |
          selenium-side-runner -c "goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage] browserName=chrome" "QuickPark E2E Tests.side" || true

      - name: Stop servers
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-tests/selenium-ide/
          retention-days: 7

  report:
    name: Test Results Summary
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Todos los tests han sido ejecutados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: Ejecutados en Node.js 18.x, 20.x, 21.x, 22.x" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: Ejecutados con Selenium IDE" >> $GITHUB_STEP_SUMMARY
          echo "- **Cobertura**: Disponible en artifacts" >> $GITHUB_STEP_SUMMARY
