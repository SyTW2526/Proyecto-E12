version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quickpark-db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - quickpark-network
    restart: unless-stopped

  backend:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    # container_name: quickpark-backend
    #build: ./backend
    image: danienri04/quickpark-sytw-backend:1.0
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - db
    networks:
      - quickpark-network
    restart: unless-stopped

  frontend:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    #   args:
    #     VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    # container_name: quickpark-frontend
    #build: ./frontend
    image: danienri04/quickpark-sytw-frontend:1.0
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - quickpark-network
    restart: unless-stopped

networks:
  quickpark-network:
    driver: bridge

volumes:
  pgdata: